[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "fulfilliq"
version = "0.1.0"
description = "Olist logistics data foundation for a university Data Mining project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
  "SQLAlchemy>=2.0.35,<3",
  "pandas>=2.2.3,<3",
  "numpy>=1.26.4,<3",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
  "mlxtend>=0.23,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[project.scripts]
fulfilliq = "fulfilliq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fulfilliq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
